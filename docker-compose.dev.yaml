version: '3.8'

services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb-dev
    environment:
      MARIADB_ROOT_PASSWORD: zabbix_root_password
      MARIADB_DATABASE: zabbix
      MARIADB_USER: zabbix
      MARIADB_PASSWORD: zabbix_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_dev_data:/var/lib/mysql
    networks:
      - zabbix-dev

  zabbix-server:
    build:
      context: .
      dockerfile: Dockerfile-zbxserver
    container_name: zabbix-server-dev
    depends_on:
      - mariadb
    environment:
      DB_SERVER_HOST: mariadb-dev
      DB_SERVER_PORT: 3306
      MYSQL_DATABASE: zabbix
      MYSQL_USERNAME: zabbix
      MYSQL_PASSWORD: zabbix_password
      MYSQL_ROOT_PASSWORD: zabbix_root_password
    ports:
      - "10051:10051"
    networks:
      - zabbix-dev

  zabbix-web:
    build:
      context: .
      dockerfile: Dockerfile-zbxweb
    container_name: zabbix-web-dev
    depends_on:
      - zabbix-server
    environment:
      DB_SERVER_HOST: mariadb-dev
      DB_SERVER_PORT: 3306
      MYSQL_DATABASE: zabbix
      MYSQL_USERNAME: zabbix
      MYSQL_PASSWORD: zabbix_password
      MYSQL_ROOT_PASSWORD: zabbix_root_password
      ZBX_SERVER_HOST: zabbix-server-dev
      PHP_TZ: Asia/Tokyo
    ports:
      - "8080:8080"
      - "8443:8443"
    networks:
      - zabbix-dev

volumes:
  mariadb_dev_data:

networks:
  zabbix-dev:
    driver: bridge